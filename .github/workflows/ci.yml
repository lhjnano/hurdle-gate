name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Unit tests
        run: pytest -q
      - name: Smoke
        run: bash tests/run_smoke.sh
      - name: Self-dogfood
        # hurdle must pass its own gate — tests/test_cli.py maps to
        # src/hurdle/cli.py. Remaining self-gaps are managed via the root .hurdle.json.
        run: hurdle scan . --strict
