# test-exist-gate.yml — hurdle source↔test existence gate (GitHub Actions template)
#
# ▶ Usage (this file is pasted into the *target repository*, not the hurdle repo):
#   1) Copy this file to .github/workflows/test-exist-gate.yml in the target repository.
#   2) Replace env.HURDLE_REPO_URL / HURDLE_REF below with the actual hurdle repository URL.
#      (To use a local path such as a private clone, see the comments in the "Install hurdle" step.)
#   3) Commit a .hurdle.json (config) at the repository root — required.
#   4) In branch protection settings, mark this workflow's check (name: test-exist-gate)
#      as a required check so PRs must pass the gate before merging.
#
# ▶ Legacy gap handling:
#   Think of the baseline as a full-scan result (covering the entire existing codebase),
#   saved with --json and committed to the repository. Example: baselines/kopia.json
#   (the output of `hurdle scan . --json baselines/kopia.json`. See BASELINES.md in the
#   hurdle repository for details.)
#
# ▶ How the gate verdict works (ratchet):
#   --diff origin/<base_ref> evaluates only files that are new or changed relative to
#   the PR's base branch. Legacy gaps remaining in the committed baseline therefore
#   never appear in the diff and cannot fail the gate; only "sources added or modified
#   in this PR that have no tests" fail under --strict. Gaps can never increase and
#   decrease monotonically over time.

name: test-exist-gate

on:
  pull_request:

permissions:
  contents: read

env:
  HURDLE_REPO_URL: https://github.com/lhjnano/hurdle.git
  HURDLE_REF: v0.1.0

jobs:
  test-exist-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — needed because --diff compares against the base branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for --diff
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Install hurdle
        run: |
          python3 -m pip install --quiet "git+$HURDLE_REPO_URL@$HURDLE_REF"
          hurdle scan --help >/dev/null
        # Alternative: run from a clone without pip:
        #   git clone --depth 1 --branch "$HURDLE_REF" "$HURDLE_REPO_URL" /tmp/hurdle
        #   PYTHONPATH=/tmp/hurdle/src python3 -m hurdle scan . ...

      - name: Run hurdle gate (new/changed files only)
        # Legacy gaps committed to the baseline are ignored because --diff evaluates only new/changed files.
        run: |
          hurdle scan . \
            --diff "origin/${{ github.base_ref }}" \
            --strict \
            --config .hurdle.json \
            --json hurdle-report.json

      - name: Upload report artifact (the report is kept even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurdle-report
          path: hurdle-report.json
          if-no-files-found: ignore
